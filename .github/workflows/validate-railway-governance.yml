name: Validate Railway Governance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Railway governance contract
        shell: bash
        run: |
          test -s README.md
          test -s AGENTS.md
          test -s RAILWAY_HUB_RULES.md
          grep -q "railway-project-hub" README.md
          grep -q "RAILWAY_HUB_RULES.md" AGENTS.md
          grep -q "railway-project-hub" RAILWAY_HUB_RULES.md
